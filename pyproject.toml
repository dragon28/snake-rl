[project]
name = "snakerl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dragon28", email = "4351285+dragon28@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "torch>=2.4",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
snakerl = "snakerl.cli:main"
